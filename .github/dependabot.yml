# Dependency policy:
# - Track current stable releases only.
# - Do not intentionally adopt alpha, beta, rc, canary, next, nightly,
#   dev, experimental, or legacy pre-release channels.
# - "latest", "stable", and normal stable SemVer releases are allowed.
# CI enforces the same rule for direct dependencies.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    groups:
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci):"
