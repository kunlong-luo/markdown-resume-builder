<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Resume Craft — Local-first Markdown Resume Builder</title>
  <desc id="desc">Resume Craft project banner with Markdown editing, live A4 preview, ATS checks, Auto Fit and PDF export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b72"/>
      <stop offset="0.52" stop-color="#263bd6"/>
      <stop offset="1" stop-color="#754cff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#08103e" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <path d="M0 108C215 4 422 27 615 121S981 197 1280 36V0H0Z" fill="#fff" opacity=".07"/>
  <path d="M0 530C245 638 441 567 646 503S1036 430 1280 532V640H0Z" fill="#081052" opacity=".28"/>
  <circle cx="1110" cy="92" r="150" fill="#8e76ff" opacity=".10"/>

  <!-- Left: branding safely contained inside x=58..585 -->
  <g transform="translate(62 92)">
    <rect width="72" height="88" rx="16" fill="#eef2ff"/>
    <path d="M48 0l24 24H58a10 10 0 0 1-10-10Z" fill="#8797ff"/>
    <rect x="15" y="38" width="39" height="7" rx="3.5" fill="#4f46e5"/>
    <rect x="15" y="55" width="45" height="7" rx="3.5" fill="#4f46e5"/>
    <rect x="15" y="72" width="31" height="7" rx="3.5" fill="#4f46e5"/>
  </g>

  <text x="62" y="250" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="68" font-weight="800" fill="#fff">Resume Craft</text>
  <text x="62" y="304" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#dfe5ff">Local-first Markdown</text>
  <text x="62" y="340" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#dfe5ff">Resume Builder</text>

  <g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#fff">
    <rect x="62" y="383" width="212" height="44" rx="22" fill="#ffffff" opacity=".12"/>
    <text x="85" y="411">◉  Live A4 Preview</text>
    <rect x="288" y="383" width="177" height="44" rx="22" fill="#ffffff" opacity=".12"/>
    <text x="311" y="411">✓  ATS Checks</text>
    <rect x="62" y="441" width="164" height="44" rx="22" fill="#ffffff" opacity=".12"/>
    <text x="85" y="469">↔  Auto Fit</text>
    <rect x="240" y="441" width="180" height="44" rx="22" fill="#ffffff" opacity=".12"/>
    <text x="263" y="469">⇩  PDF Export</text>
  </g>

  <line x1="62" y1="522" x2="500" y2="522" stroke="#aebaff" stroke-width="2" opacity=".65"/>
  <text x="62" y="558" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" fill="#dfe5ff">Open Source · Local-first · React + TypeScript</text>

  <!-- Right: complete app mockup, isolated from branding -->
  <g transform="translate(628 74)" filter="url(#shadow)">
    <rect width="590" height="492" rx="24" fill="url(#card)" stroke="#d9e1ff" stroke-width="3"/>
    <rect width="590" height="44" rx="24" fill="#eef2ff"/>
    <circle cx="23" cy="22" r="6" fill="#ff625f"/>
    <circle cx="43" cy="22" r="6" fill="#ffbd44"/>
    <circle cx="63" cy="22" r="6" fill="#23c552"/>

    <rect x="18" y="62" width="84" height="404" rx="14" fill="#e9edff"/>
    <g font-family="Inter,ui-sans-serif,system-ui" font-size="12" font-weight="700" fill="#2638bd">
