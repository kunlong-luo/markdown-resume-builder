    <rect x="114" y="62" width="216" height="404" rx="14" fill="#fff"/>
    <text x="132" y="93" font-family="Inter,ui-sans-serif,system-ui" font-size="13" font-weight="800" fill="#17216d">Markdown</text>
    <line x1="132" y1="106" x2="202" y2="106" stroke="#4f46e5" stroke-width="3"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#243078">
      <text x="132" y="137"># Alex Chen</text>
      <text x="132" y="159">Software Engineer</text>
      <text x="132" y="199">## Summary</text>
      <text x="132" y="220">Building delightful products</text>
      <text x="132" y="239">with design and technology.</text>
      <text x="132" y="283">## Experience</text>
      <text x="132" y="305">### Senior Software Engineer</text>
      <text x="132" y="326">Acme Corp · 2022 – Present</text>
      <text x="132" y="350">- Built scalable web apps</text>
      <text x="132" y="371">- Led a team of 4 engineers</text>
      <text x="132" y="410">## Skills</text>
      <text x="132" y="431">TypeScript · React · Vite</text>
    </g>

    <path d="M301 209c20-24 40-24 60 0" fill="none" stroke="#7182ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M356 201l9 16-18 2" fill="#7182ff"/>

    <rect x="342" y="62" width="230" height="404" rx="14" fill="#fff"/>
    <text x="365" y="111" font-family="Inter,ui-sans-serif,system-ui" font-size="27" font-weight="800" fill="#12184d">Alex Chen</text>
    <text x="366" y="132" font-family="Inter,ui-sans-serif,system-ui" font-size="11.5" fill="#47507a">Software Engineer</text>
    <line x1="365" y1="152" x2="550" y2="152" stroke="#dce2f8"/>
    <text x="365" y="182" font-family="Inter,ui-sans-serif,system-ui" font-size="11.5" font-weight="800" fill="#12184d">SUMMARY</text>
    <text x="365" y="203" font-family="Inter,ui-sans-serif,system-ui" font-size="10.5" fill="#47507a">Building delightful products with</text>
    <text x="365" y="219" font-family="Inter,ui-sans-serif,system-ui" font-size="10.5" fill="#47507a">design and technology.</text>
    <text x="365" y="261" font-family="Inter,ui-sans-serif,system-ui" font-size="11.5" font-weight="800" fill="#12184d">EXPERIENCE</text>
    <circle cx="372" cy="289" r="4" fill="#2638bd"/>
    <line x1="372" y1="289" x2="372" y2="357" stroke="#8b97d6"/>
    <text x="387" y="291" font-family="Inter,ui-sans-serif,system-ui" font-size="10.5" font-weight="700" fill="#12184d">Senior Software Engineer</text>
    <text x="387" y="311" font-family="Inter,ui-sans-serif,system-ui" font-size="9.5" fill="#586083">Acme Corp · 2022 – Present</text>
    <text x="387" y="339" font-family="Inter,ui-sans-serif,system-ui" font-size="9.5" fill="#586083">• Built scalable applications</text>
    <text x="387" y="356" font-family="Inter,ui-sans-serif,system-ui" font-size="9.5" fill="#586083">• Improved performance</text>
    <text x="365" y="400" font-family="Inter,ui-sans-serif,system-ui" font-size="11.5" font-weight="800" fill="#12184d">SKILLS</text>
    <g font-family="Inter,ui-sans-serif,system-ui" font-size="9" fill="#29336d">
      <rect x="365" y="414" width="53" height="20" rx="10" fill="#eef1ff"/>
      <text x="378" y="428">React</text>
      <rect x="425" y="414" width="70" height="20" rx="10" fill="#eef1ff"/>
      <text x="436" y="428">TypeScript</text>
      <rect x="502" y="414" width="50" height="20" rx="10" fill="#eef1ff"/>
      <text x="515" y="428">Vite</text>
    </g>
  </g>
