    <text x="130" y="92" font-family="Inter,ui-sans-serif,system-ui" font-size="13" font-weight="800" fill="#161f6a">Markdown</text>
    <line x1="130" y1="104" x2="195" y2="104" stroke="#4f46e5" stroke-width="3"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#243078">
      <text x="132" y="135"># Alex Chen</text>
      <text x="132" y="158">Software Engineer</text>
      <text x="132" y="201">## Summary</text>
      <text x="132" y="223">Building delightful products</text>
      <text x="132" y="242">at the intersection of design</text>
      <text x="132" y="261">and technology.</text>
      <text x="132" y="304">## Experience</text>
      <text x="132" y="326">### Senior Software Engineer</text>
      <text x="132" y="348">Acme Corp · 2022 – Present</text>
      <text x="132" y="370">- Built scalable web apps</text>
      <text x="132" y="392">- Led a team of 4 engineers</text>
    </g>

    <path d="M302 178c30-36 60-36 91 0" fill="none" stroke="#7182ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M388 168l10 18-21 2" fill="#7182ff"/>

    <rect x="344" y="62" width="228" height="394" rx="14" fill="#ffffff"/>
    <text x="368" y="111" font-family="Inter,ui-sans-serif,system-ui" font-size="28" font-weight="800" fill="#12184d">Alex Chen</text>
    <text x="369" y="132" font-family="Inter,ui-sans-serif,system-ui" font-size="12" fill="#39406e">Software Engineer</text>
    <line x1="368" y1="153" x2="548" y2="153" stroke="#dce2f8"/>
    <text x="368" y="183" font-family="Inter,ui-sans-serif,system-ui" font-size="12" font-weight="800" fill="#12184d">SUMMARY</text>
    <text x="368" y="205" font-family="Inter,ui-sans-serif,system-ui" font-size="11" fill="#39406e">Building delightful products with</text>
    <text x="368" y="222" font-family="Inter,ui-sans-serif,system-ui" font-size="11" fill="#39406e">great design and technology.</text>
    <text x="368" y="264" font-family="Inter,ui-sans-serif,system-ui" font-size="12" font-weight="800" fill="#12184d">EXPERIENCE</text>
    <circle cx="375" cy="292" r="4" fill="#2434b7"/>
    <line x1="375" y1="292" x2="375" y2="365" stroke="#8a96d7"/>
    <text x="390" y="294" font-family="Inter,ui-sans-serif,system-ui" font-size="11" font-weight="700" fill="#12184d">Senior Software Engineer</text>
    <text x="390" y="314" font-family="Inter,ui-sans-serif,system-ui" font-size="10" fill="#4b537e">Acme Corp</text>
    <text x="390" y="343" font-family="Inter,ui-sans-serif,system-ui" font-size="10" fill="#4b537e">• Built scalable applications</text>
    <text x="390" y="360" font-family="Inter,ui-sans-serif,system-ui" font-size="10" fill="#4b537e">• Improved performance by 40%</text>
    <text x="368" y="405" font-family="Inter,ui-sans-serif,system-ui" font-size="12" font-weight="800" fill="#12184d">SKILLS</text>
    <g font-family="Inter,ui-sans-serif,system-ui" font-size="9" fill="#29336d">
      <rect x="368" y="418" width="54" height="20" rx="10" fill="#eef1ff"/><text x="380" y="432">React</text>
      <rect x="429" y="418" width="68" height="20" rx="10" fill="#eef1ff"/><text x="440" y="432">TypeScript</text>
      <rect x="504" y="418" width="51" height="20" rx="10" fill="#eef1ff"/><text x="515" y="432">Vite</text>
    </g>
  </g>
</svg>
