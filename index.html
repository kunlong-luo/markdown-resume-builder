  <body class="bg-[#070a13] text-slate-100">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;background:#070a13;color:#e2e8f0;font-family:sans-serif;">
        <!-- Header Skeleton -->
        <div style="height:56px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0d1527;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:28px;height:28px;border-radius:8px;background:rgba(79,70,229,0.3);animation:pulse 1.5s infinite;"></div>
            <div style="width:120px;height:16px;border-radius:4px;background:rgba(255,255,255,0.15);animation:pulse 1.5s infinite;"></div>
          </div>
          <div style="display:flex;gap:12px;">
            <div style="width:80px;height:32px;border-radius:8px;background:rgba(255,255,255,0.08);animation:pulse 1.5s infinite;"></div>
            <div style="width:96px;height:32px;border-radius:8px;background:linear-gradient(90deg, #4F46E5, #2563EB);opacity:0.8;animation:pulse 1.5s infinite;"></div>
          </div>
        </div>
        <!-- Main Split Skeleton -->
        <div style="flex:1;display:flex;overflow:hidden;">
          <div style="width:50%;border-right:1px solid rgba(255,255,255,0.08);padding:24px;display:flex;flex-direction:column;gap:16px;">
            <div style="width:40%;height:20px;border-radius:4px;background:rgba(255,255,255,0.1);animation:pulse 1.5s infinite;"></div>
            <div style="width:100%;height:120px;border-radius:8px;background:rgba(255,255,255,0.04);animation:pulse 1.5s infinite;"></div>
            <div style="width:100%;height:200px;border-radius:8px;background:rgba(255,255,255,0.04);animation:pulse 1.5s infinite;"></div>
          </div>
          <div style="width:50%;background:#030508;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="width:380px;height:538px;border-radius:8px;background:#ffffff;opacity:0.06;box-shadow:0 10px 30px rgba(0,0,0,0.5);animation:pulse 1.5s infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 0.25; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
